<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fydio Companion</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        background: #fafaf9;
        color: #1c1917;
        box-sizing: border-box;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #0f172a;
      }
      .badge {
        font-size: 11px;
        font-weight: 500;
        background: #e2e8f0;
        color: #475569;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding: 8px 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
      }
      .toggle-label {
        font-size: 13px;
        font-weight: 600;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #cbd5e1;
        transition: 0.2s;
        border-radius: 22px;
      }
      .slider:before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #0284c7;
      }
      input:checked + .slider:before {
        transform: translateX(18px);
      }
      .disclaimer {
        font-size: 12px;
        line-height: 1.4;
        color: #64748b;
        margin-bottom: 12px;
        background: #f1f5f9;
        padding: 8px;
        border-radius: 6px;
        border-left: 3px solid #0284c7;
      }
      .status-msg {
        font-size: 12px;
        margin-bottom: 12px;
        font-weight: 500;
      }
      .status-msg.enabled {
        color: #059669;
      }
      .status-msg.disabled {
        color: #64748b;
      }
      .links {
        font-size: 12px;
        border-top: 1px solid #e2e8f0;
        padding-top: 8px;
      }
      .links a {
        color: #0284c7;
        text-decoration: none;
      }
      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Fydio Companion <span class="badge">Optional</span></h1>

    <div class="toggle-row">
      <span class="toggle-label">Active-Tab Duration</span>
      <label class="switch">
        <input type="checkbox" id="consent-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="disclaimer">
      Private to you. Never affects Credits or Reputation. Turn it off or delete past records at any
      time.
    </div>

    <div id="status-message" class="status-msg disabled">Checking consent status...</div>

    <div class="links">
      Manage your activity in
      <a href="http://localhost:3000/settings/privacy" id="privacy-link">Privacy Settings &rarr;</a>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
